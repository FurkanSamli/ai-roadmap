<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" id="brandLink" href="#/"><span class="logo" aria-hidden="true"></span><span data-t="brand">AI Roadmap</span></a>
  <div class="search">
    <label class="box" for="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false" data-t-ph="search" aria-controls="sres">
      <kbd>/</kbd>
    </label>
    <ul class="sres" id="sres" role="listbox" hidden></ul>
  </div>
  <div class="top-r">
    <div class="overall"><span id="overall"></span><span class="obar" id="overallBar"></span></div>
    <span class="sync" id="sync" role="status"></span>
    <button class="btn" id="bkBtn" type="button" data-t="backup">Data</button>
  </div>
</header>

<main class="page">
  <div class="rm-head" id="rmHead"></div>
  <div class="rm" id="rm"></div>
  <p class="load-err" id="loadErr" hidden></p>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-labelledby="drawerTitle" hidden>
  <button class="btn x" id="drawerClose" type="button" data-t="close">Close</button>
  <div class="drawer-scroll" id="drawerScroll"><div id="drawerBody"></div></div>
</aside>

<div class="overlay" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="bkT">
    <div class="row"><h2 id="bkT" data-t="bkTitle"></h2><button class="btn x" id="bkClose" type="button" data-t="close"></button></div>
    <div class="where" id="bkWhere"></div>
    <h3 data-t="bkExport"></h3>
    <p class="tipline" data-t="bkExportP"></p>
    <div class="row"><button class="btn solid" id="bkDownload" type="button" data-t="download"></button><button class="btn" id="bkCopy" type="button" data-t="copy"></button><span class="msg" id="bkCopyMsg"></span></div>
    <hr>
    <h3 data-t="bkImport"></h3>
    <textarea id="bkIn" data-t-ph="bkImportPh" aria-label="JSON"></textarea>
    <div class="row">
      <button class="btn solid" id="bkLoad" type="button" data-t="load"></button>
      <label class="filelbl"><input type="file" id="bkFile" accept=".json,.txt,application/json"><span data-t="fromFile"></span></label>
      <span class="msg" id="bkLoadMsg"></span>
    </div>
    <hr>
    <h3 data-t="bkReset"></h3>
    <div class="row" id="bkResetRow"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
